{% load static %}


<!DOCTYPE html>
<html lang="en">


<head>


   <meta charset="UTF-8">


   <meta name="viewport" content="width=device-width, initial-scale=1.0">


   <title>CrewConnect</title>




   <!-- Bootstrap CSS -->


   <link
       href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
       rel="stylesheet"
   >




   <!-- Bootstrap Icons -->


   <link
       rel="stylesheet"
       href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
   >




   <!-- Sidebar CSS -->


   <link
       rel="stylesheet"
       href="{% static 'css/Sidebar.css' %}"
   >




   <!-- Page Specific CSS -->


   {% block extra_css %}
   {% endblock %}


</head>




<body>




   <!-- ================================
        ROLE BASED SIDEBAR
   ================================= -->


   {% if is_employee %}


       <!-- Employee -->


       {% include "employee_sidebar.html" %}


   {% else %}


       <!-- HR / Admin -->


       {% include "sidebar.html" %}


   {% endif %}




   <!-- ================================
        MAIN CONTENT
   ================================= -->


   <div class="main-content">


       {% block content %}
       {% endblock %}


   </div>




   <!-- ================================
        BOOTSTRAP JS
   ================================= -->


   <script
       src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
   </script>




   <!-- ================================
        PAGE SPECIFIC JS
   ================================= -->


   {% block extra_js %}
   {% endblock %}


</body>

</html>
